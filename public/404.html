<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>Stranica nije pronađena · Vikendica Meri</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- Styles are inline: this page is served outside the hashed Vite bundle. -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        background: #0a0e1a;
        color: #f5f0e8;
        font-family: 'Inter', system-ui, sans-serif;
        line-height: 1.65;
      }
      .code {
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #d4943a;
        margin-bottom: 0.9rem;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 600;
        line-height: 1.14;
        font-size: clamp(1.9rem, 5vw, 2.8rem);
        margin-bottom: 1rem;
      }
      p { color: rgba(245, 240, 232, 0.72); max-width: 42ch; margin: 0 auto 2rem; }
      a {
        display: inline-block;
        padding: 0.85rem 1.9rem;
        border-radius: 50px;
        background: #d4943a;
        color: #20140a;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.25s ease;
      }
      a:hover { background: #e5a84d; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Greška 404</p>
      <h1>Ova stranica ne postoji</h1>
      <p>
        Možda je link zastario ili je adresa pogrešno unesena. Vratite se na
        početnu i nastavite razgledanje vikendice.
      </p>
      <a href="/">Nazad na početnu</a>
    </main>
  </body>
</html>
